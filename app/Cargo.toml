[package]
name = "scribblecap-app"
description = "ScribbleCap desktop app (Tauri 2 shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri = { workspace = true, features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
scribblecap-core.workspace = true
scribblecap-formats.workspace = true
scribblecap-capture.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

[lints]
workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
drag = "2.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14.3", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
gtk = "0.18"
url = "2"

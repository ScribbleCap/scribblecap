[package]
name = "scribblecap-app"
description = "ScribbleCap desktop app (Tauri 2 shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
scribblecap-core.workspace = true
scribblecap-formats.workspace = true
scribblecap-capture.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

[lints]
workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
drag = "2.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSharingService", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["ApplicationModel_DataTransfer", "Storage", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_WinRT"] }
windows-collections = "0.3.2"

version: 2
# Grouped to keep the PR count low: about one PR per ecosystem a week. Minor and
# patch updates share a PR; a major update gets its own PR so it can be reviewed
# on its own. Tauri's Rust crates and its npm packages are each kept together.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
        update-types: [minor, patch]
      rust:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
        update-types: [minor, patch]
      ui:
        patterns: ["*"]
        update-types: [minor, patch]
